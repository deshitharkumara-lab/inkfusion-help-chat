<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cad">
  <title>iNK Fusion Help</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5cad'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EiN%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo" aria-hidden="true">iN</div>
      <h1>iNK Fusion Help <small id="subtitle">Breakdown help</small></h1>
      <a id="callTop" class="call-top" href="#" hidden>📞 Call</a>
    </header>
    <main id="log" class="log" aria-live="polite"></main>
    <div class="privacy" id="privacy"></div>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" class="icon-btn" id="photoBtn" aria-label="Send a photo">📷</button>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <input type="text" id="text" maxlength="1000" aria-label="Type a message">
      <button type="submit" class="icon-btn send" aria-label="Send">➤</button>
    </form>
  </div>
  <script src="/chat.js"></script>
</body>
</html>
