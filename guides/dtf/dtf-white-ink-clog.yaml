id: dtf-white-ink-clog
machine: dtf
problem: White ink clogging / weak or missing white layer
safety: "Keep the printer ON. Wear gloves. Do not open the ink lines or the head."
steps:
  - text: "Check that the white ink circulation or stirring is switched on. (On most DTF printers it runs automatically.)"
  - text: "Gently shake or stir the white ink tank or bottle, as your machine allows. White ink settles quickly."
  - text: "Print a nozzle check and look at the white channel. Send a photo if you can."
  - text: "If white lines are missing, run 1 normal head cleaning for the white channel."
  - text: "Print the nozzle check again."
max_attempts_before_escalation: 3
escalate_if:
  - "White still missing after 3 cleanings"
  - "The white circulation pump is not running or makes a noise"
  - "Ink is leaking"
  - "A head error code is shown"
prevention_tip: "Shake or stir the white ink every day before printing, and keep white circulation switched on, even when the printer is not in use."
status: draft
owner_check:
  - "Do your DTF printers have automatic white ink circulation? How does the customer check it is running?"
  - "Should customers shake the white ink bottle, stir the tank, or both?"
